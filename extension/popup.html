<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Apex Download Manager</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status-online .dot { background: #10b981; }
    .status-offline .dot { background: #ef4444; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(16px); }
    .quick-add {
      margin-top: 14px;
      border-top: 1px solid #1e293b;
      padding-top: 12px;
    }
    .quick-add input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 12px;
      outline: none;
      margin-bottom: 8px;
    }
    .quick-add input:focus {
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 8px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .info-footer {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Apex Download Manager
    </div>
    <div id="statusPill" class="status-pill status-offline">
      <div class="dot"></div>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="row">
    <span>Auto-Catch Browser Downloads</span>
    <label class="switch">
      <input type="checkbox" id="autoCatchToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="quick-add">
    <input type="text" id="urlInput" placeholder="Paste download or video URL..." />
    <button id="sendBtn" class="btn">Send to ADM</button>
  </div>

  <div class="info-footer">
    Multi-connection accelerator active & ready
  </div>

  <script src="popup.js"></script>
</body>
</html>
